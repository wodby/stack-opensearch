name: opensearch
title: OpenSearch
icon: opensearch

services:
- name: opensearch
  title: OpenSearch
  service: opensearch
  required: true
  volumes:
  - name: data
    size: 20
  workloads:
  - name: main
    containers:
    - name: opensearch
      resources:
        request:
          cpu: 1000
          memory: 2048
        limit:
          cpu: 2000
          memory: 4096
- name: opensearch-dashboards
  title: OpenSearch Dashboards
  service: opensearch-dashboards
  main: true
  links:
  - name: opensearch
    service: opensearch
  workloads:
  - name: main
    containers:
    - name: opensearch-dashboards
      resources:
        request:
          cpu: 500
          memory: 1024
        limit:
          cpu: 1000
          memory: 2048
